constants:
  name: "db-backup"
  pg_user: "${PG_USER}"
  pg_password: "${PG_PASS}"
  # mongo_xbs_user: "${MONGO_XBS_USER}"
  # mongo_xbs_password: "${MONGO_XBS_PASS}"

source_directories: []

repositories:
  - path: /mnt/backup/db
    label: local

archive_name_format: 'db-backup-{now:%Y-%m-%d-%H%M%S}'

read_special: true

sqlite_databases:
  # arr
  - name: prowlarr
    path: /mnt/source/docker/prowlarr/prowlarr.db
    restore_path: /mnt/restore/prowlarr/prowlarr.db
  - name: sonarr
    path: /mnt/source/docker/sonarr/sonarr.db
    restore_path: /mnt/restore/sonarr/sonarr.db
  - name: sonarr-anime
    path: /mnt/source/docker/sonarr-anime/sonarr.db
    restore_path: /mnt/restore/sonarr-anime/sonarr.db
  - name: radarr
    path: /mnt/source/docker/radarr/radarr.db
    restore_path: /mnt/restore/radarr/radarr.db
  - name: bazarr
    path: /mnt/source/docker/bazarr/db/bazarr.db
    restore_path: /mnt/restore/bazarr/db/bazarr.db
  # gw
  - name: pgadmin
    path: /mnt/source/docker/pgadmin/pgadmin4.db
    restore_path: /mnt/restore/pgadmin/pgadmin4.db
  - name: nginx-proxy-manager
    path: /mnt/source/docker/nginx-proxy-manager/data/database.sqlite
    restore_path: /mnt/restore/nginx-proxy-manager/data/database.sqlite
  # jelly
  - name: jellyfin_main
    path: /mnt/source/docker/jellyfin/data/data/jellyfin.db
    restore_path: /mnt/restore/jellyfin/data/data/jellyfin.db
  - name: jellyfin_library
    path: /mnt/source/docker/jellyfin/data/data/library.db
    restore_path: /mnt/restore/jellyfin/data/data/library.db
  - name: jellyseerr
    path: /mnt/source/docker/jellyseerr/db/db.sqlite3
    restore_path: /mnt/restore/jellyseerr/db/db.sqlite3
  # finance
  - name: actualbudget_accounts
    path: /mnt/source/docker/actual-budget/server-files/account.sqlite
    restore_path: /mnt/restore/actual-budget/server-files/account.sqlite
  - name: actualbudget_userfiles_group-f2e71631-491f-4b08-b516-bf35241149f8
    path: /mnt/source/docker/actual-budget/user-files/group-f2e71631-491f-4b08-b516-bf35241149f8.sqlite
    restore_path: /mnt/restore/actual-budget/user-files/group-f2e71631-491f-4b08-b516-bf35241149f8.sqlite

postgresql_databases:
  - name: lldap
    hostname: lldap-db
    port: 5432
    username: "{pg_user}"
    password: "{pg_password}"
    no_owner: true
    format: directory
  - name: authelia
    hostname: authelia-db
    port: 5432
    username: "{pg_user}"
    password: "{pg_password}"
    no_owner: true
    format: directory
  - name: ryot
    hostname: ryot-db
    port: 5432
    username: "{pg_user}"
    password: "{pg_password}"
    no_owner: true
    format: directory
  - name: affine
    hostname: affine-db
    port: 5432
    username: "{pg_user}"
    password: "{pg_password}"
    no_owner: true
    format: directory
  - name: solidtime
    hostname: solidtime-db
    port: 5432
    username: "{pg_user}"
    password: "{pg_password}"
    no_owner: true
    format: directory
  - name: vaultwarden
    hostname: vaultwarden-db
    port: 5432
    username: "{pg_user}"
    password: "{pg_password}"
    no_owner: true
    format: directory

# mongodb_databases:
#     - name: all
#       hostname: xbs-db
#       port: 27018
#       username: "{mongo_xbs_user}"
#       password: "{mongo_xbs_password}"
#       authentication_database: mongousers
#       options: "--ssl"

after_backup:
  - echo Syncing backups
  - rclone sync /mnt/backup/db bb:phoenix0/db --progress --stats-one-line --stats 1s
  - rclone sync /mnt/backup/db koofr:/db --progress --stats-one-line --stats 1s
  - rclone sync /mnt/backup/db gdrive:/db --progress --stats-one-line --stats 1s
  - echo Finished backup sync

<<: !include /etc/borgmatic.d/shared/shared-config.yaml