version: "3.8"
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.10.7
    container_name: jellyfin
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - JELLYFIN_PublishedServerUrl=$JELLY_URL
    ports:
      - 8096:8096
    volumes:
      - $DATA_DIR/jellyfin:/config
      - $MEDIA_DIR:/media
    restart: unless-stopped
    networks:
      - jelly_npm
      - jellyfin_ldap
  jellyseerr:
    image: fallenbagel/jellyseerr:2.7.0
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=$TZ
      - PORT=5055
    ports:
      - 5055:5055
    volumes:
      - $DATA_DIR/jellyseerr:/app/config
    restart: unless-stopped
    networks:
      - jelly_npm
      - arr_default
networks:
  arr_default:
    external: true
  jelly_npm:
    external: true
  jellyfin_ldap:
    external: true
