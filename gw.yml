x-npm-networks: &a1
  lldap_npm: null
  actual_budget_npm: null
  affine_npm: null
  jelly_npm: null
  arr_npm: null
  ryot_npm: null
  solidtime_npm: null
  vaultwarden_npm: null
  nextcloud_npm: null
services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.11.3
    container_name: nginx-proxy-manager
    environment:
      - PUID=568
      - PGID=568
      - DISABLE_IPV6=true
    ports:
      - 80:80
      - 8080:81
      - 443:443
    volumes:
      - $DATA_DIR/nginx-proxy-manager/data:/data
      - $DATA_DIR/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
      - $DATA_DIR/nginx-proxy-manager/snippets:/snippets
    healthcheck:
      test:
        - CMD
        - /usr/bin/check-health
      interval: 10s
      timeout: 3s
    restart: unless-stopped
    networks:
      <<: *a1
      npm_internal: null
  authelia:
    image: authelia/authelia:4.39.4
    container_name: authelia
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/London
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE=/run/secrets/authelia_reset_jwt
      - AUTHELIA_SESSION_SECRET_FILE=/run/secrets/authelia_session_secret
      - AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE=/run/secrets/authelia_db_password
      - AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE=/run/secrets/authelia_encryption_key
      - AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE=/run/secrets/authelia_ldap_password
      - AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE=/run/secrets/smtp_password
      - AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE=/run/secrets/authelia_hmac_secret
    ports:
      - 9091:9091
    volumes:
      - $DATA_DIR/authelia/app:/config
    secrets:
      - authelia_reset_jwt
      - authelia_session_secret
      - authelia_db_password
      - authelia_encryption_key
      - authelia_ldap_password
      - authelia_hmac_secret
      - smtp_password
    restart: unless-stopped
    networks:
      - authelia_internal
      - npm_internal
      - authelia_ldap
  authelia-db:
    image: postgres:17.0
    container_name: authelia-db
    environment:
      - POSTGRES_DB=authelia
      - POSTGRES_USER_FILE=/run/secrets/authelia_db_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/authelia_db_password
    # ports:
    #   - 5432:5432
    volumes:
      - $DATA_DIR/authelia/db:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d $$POSTGRES_DB -U `cat $$POSTGRES_USER_FILE`
      interval: 1s
      timeout: 5s
      retries: 10
    secrets:
      - authelia_db_user
      - authelia_db_password
    restart: unless-stopped
    networks:
      - authelia_internal
      - authelia_db_backup
      - authelia_db_admin
  cloudflareddns:
    image: hotio/cloudflareddns:latest
    container_name: cloudflareddns
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/London
      - CF_ZONES_FILE=/run/secrets/cf_zones
      - CF_HOSTS_FILE=/run/secrets/cf_hosts
      - CF_RECORDTYPES=A;A
      - CF_USER_FILE=/run/secrets/cf_user
      - CF_APITOKEN_ZONE_FILE=/run/secrets/cf_api_key
      - CF_APITOKEN_FILE=/run/secrets/cf_api_key
    volumes:
      - $DATA_DIR/cloudflareddns:/config
    secrets:
      - cf_user
      - cf_api_key
      - cf_zones
      - cf_hosts
    restart: unless-stopped
secrets:
  authelia_reset_jwt:
    file: $SECRET_DIR/AUTHELIA_RESET_JWT
  authelia_session_secret:
    file: $SECRET_DIR/AUTHELIA_SESSION_SECRET
  authelia_encryption_key:
    file: $SECRET_DIR/AUTHELIA_ENCRYPTION_KEY
  authelia_ldap_password:
    file: $SECRET_DIR/AUTHELIA_LDAP_PASSWORD
  authelia_hmac_secret:
    file: $SECRET_DIR/AUTHELIA_HMAC_SECRET
  authelia_db_user:
    file: $SECRET_DIR/AUTHELIA_DATABASE_USER
  authelia_db_password:
    file: $SECRET_DIR/AUTHELIA_DATABASE_PASSWORD
  smtp_password:
    file: $SECRET_DIR/SMTP_PASSWORD
  cf_user:
    file: $SECRET_DIR/CLOUDFLARE_USER
  cf_api_key:
    file: $SECRET_DIR/CLOUDFLARE_API_KEY
  cf_zones:
    file: $SECRET_DIR/CLOUDFLARE_ZONES
  cf_hosts:
    file: $SECRET_DIR/CLOUDFLARE_HOSTS
  mongodb_user:
    file: $SECRET_DIR/MONGODB_USER
  mongodb_password:
    file: $SECRET_DIR/MONGODB_PASSWORD
  mongodb_url:
    file: $SECRET_DIR/MONGODB_URL
  unifi_mongodb_password:
    file: $SECRET_DIR/UNIFI_MONGODB_PASSWORD
networks:
  npm_internal: null
  authelia_internal: null
  authelia_db_backup:
    external: true
  authelia_db_admin:
    external: true
  authelia_ldap:
    external: true
  actual_budget_npm:
    external: true
  affine_npm:
    external: true
  jelly_npm:
    external: true
  arr_npm:
    external: true
  ryot_npm:
    external: true
  solidtime_npm:
    external: true
  vaultwarden_npm:
    external: true
  lldap_npm:
    external: true
  nextcloud_npm:
    external: true
